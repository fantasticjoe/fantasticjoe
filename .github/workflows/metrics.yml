name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

# One run collects the data and commits both display sizes together.
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  languages:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect language data
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fantasticjoe
          filename: metrics-languages-raw.svg
          output_action: none
          config_timezone: Asia/Shanghai
          config_animations: "no"
          base: ""
          plugin_languages: "yes"
          plugin_languages_limit: 10
          plugin_languages_threshold: "0%"
          plugin_languages_other: "yes"
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

      # Metrics exports /renders from its container to /metrics_renders on
      # the runner. The raw SVG stays outside the repository.
      - name: Render desktop and mobile cards
        run: python3 .github/scripts/render-language-card.py /metrics_renders/metrics-languages-raw.svg

      - name: Commit language cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics-languages.svg metrics-languages-compact.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update language activity cards [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
