name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}

# Serialize runs: concurrent runs race on committing the same SVGs
# (stale file SHA -> "does not match" commit errors)
concurrency:
  group: metrics
  cancel-in-progress: true

# Profile card palette: teal #53D6CA, navy #1F222E, ice blue #8EDFE8.
# Both variants use dark cards for a consistent profile layout.
jobs:
  # ======================
  # Languages (light / dark)
  # Keep GitHub language colors; use the shared palette for the card and labels
  # ======================
  languages-light:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages-light.svg
          config_timezone: Asia/Shanghai
          config_animations: no
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_threshold: "0%"
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          extras_css: |
            /* Shared profile card palette: teal and ice blue on navy. */
            :root { background: #1F222E; border-radius: 8px; }
            h2, h3 { color: #53D6CA !important; }
            svg { color: #F3F4F6 !important; }
            .field svg { fill: #8EDFE8 !important; }
            .field.language.details small { color: #A6ACCD !important; }
            [fill="#959da5"] { fill: #A6ACCD !important; }
            /* Give language names and numeric details their own space. */
            .field.language.details { gap: 8px; }
            .field.language.details > .field { flex: 1 1 auto; min-width: 0; }
            .field.language.details > small { flex: 0 0 auto; gap: 8px; }
            .field.language.details small > * { flex: none; }
            .field.language.details small > :not(:last-child) { margin-right: 0; }

  languages-dark:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages-dark.svg
          config_timezone: Asia/Shanghai
          config_animations: no
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_threshold: "0%"
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          extras_css: |
            /* Shared profile card palette: teal and ice blue on navy. */
            :root { background: #1F222E; border-radius: 8px; }
            h2, h3 { color: #53D6CA !important; }
            svg { color: #F3F4F6 !important; }
            .field svg { fill: #8EDFE8 !important; }
            .field.language.details small { color: #A6ACCD !important; }
            [fill="#959da5"] { fill: #A6ACCD !important; }
            /* Give language names and numeric details their own space. */
            .field.language.details { gap: 8px; }
            .field.language.details > .field { flex: 1 1 auto; min-width: 0; }
            .field.language.details > small { flex: 0 0 auto; gap: 8px; }
            .field.language.details small > * { flex: none; }
            .field.language.details small > :not(:last-child) { margin-right: 0; }
