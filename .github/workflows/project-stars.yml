name: Project stars

on:
  # 08:15 in Asia/Shanghai.
  schedule: [{cron: "15 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/update-project-stars.py"
      - ".github/workflows/project-stars.yml"
      - "assets/projects/*.svg"

concurrency:
  group: project-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh project star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-project-stars.py

      - name: Commit project cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update project star counts [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
