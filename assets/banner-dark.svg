<svg xmlns="http://www.w3.org/2000/svg" width="640" height="156" viewBox="0 0 640 156" role="img" aria-labelledby="title desc">
  <title id="title">Joe Zhu</title>
  <desc id="desc">Bioinformatics, code, and photography.</desc>
  <defs><clipPath id="typing"><rect class="reveal" x="66" y="99" width="508" height="32"/></clipPath></defs>
  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .reveal { animation: type 8s steps(35, end) infinite; }
    @keyframes type { 0%, 5% { width: 0; } 52%, 92% { width: 508px; } 100% { width: 0; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  </style>
  <text x="320" y="76" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="-2" fill="#53D6CA">Joe Zhu</text>
  <text x="320" y="122" text-anchor="middle" font-size="20" fill="#53D6CA" clip-path="url(#typing)">Bioinformatics · Code · Photography</text>
</svg>
